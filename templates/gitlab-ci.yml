# =============================================================================
# .gitlab/security-scan.yml
# GitLab CI security scanning jobs — include this in your main .gitlab-ci.yml
#
# Usage in .gitlab-ci.yml:
#   include:
#     - local: '.gitlab/security-scan.yml'
#
# Variables you can override in project CI/CD settings:
#   SECURITY_FAIL_ON      — critical | high | medium (default: high)
#   SECURITY_OVERRIDE     — true to skip blocking (requires maintainer, logged)
#   SEMGREP_APP_TOKEN     — optional: Semgrep Cloud token for managed rules
#   TRIVY_CACHE_DIR       — Trivy DB cache (auto-mounted in shared runners)
# =============================================================================

variables:
  SECURITY_FAIL_ON: "high"
  SECURITY_OVERRIDE: "false"
  SECURITY_REPORTS_DIR: "security-reports"
  TRIVY_CACHE_DIR: ".trivy-cache"
  SCAN_SCRIPTS_DIR: ".gitlab/security-scripts"

# ── Base job template (shared config) ────────────────────────────────────────
.security-base:
  image: python:3.11-slim
  tags:
    - docker  # adjust to your runner tag
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git nodejs npm
    - pip install semgrep --quiet
    # Install Gitleaks
    - |
      GITLEAKS_VERSION="8.18.2"
      curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
        | tar -xz -C /usr/local/bin gitleaks
    # Install Trivy
    - |
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
        | sh -s -- -b /usr/local/bin
    - mkdir -p "$SECURITY_REPORTS_DIR"
    - chmod +x ${SCAN_SCRIPTS_DIR}/*.sh
  cache:
    key: "security-tools-$CI_COMMIT_REF_SLUG"
    paths:
      - .trivy-cache/
    policy: pull-push
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - security-reports/
    reports:
      # GitLab Security Dashboard integration
      sast: security-reports/sast-results.json
  interruptible: true

# ── MR Scan Job ───────────────────────────────────────────────────────────────
# Runs on every MR. Blocks merge on CRITICAL/HIGH findings.
security:mr-scan:
  extends: .security-base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never
  script:
    - |
      echo "🔍 Security scan for MR: $CI_MERGE_REQUEST_IID"
      echo "    Branch: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME → $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      
      ${SCAN_SCRIPTS_DIR}/scan-all.sh \
        --path . \
        --output "$SECURITY_REPORTS_DIR" \
        --mode mr \
        --branch "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" \
        --fail-on "$SECURITY_FAIL_ON"
      
      SCAN_EXIT=$?
      
      # Log override if used
      if [[ "$SECURITY_OVERRIDE" == "true" ]]; then
        echo "⚠️  SECURITY_OVERRIDE=true — scan findings ignored by $GITLAB_USER_LOGIN"
        echo "    This override is logged. Override at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        exit 0
      fi
      
      exit $SCAN_EXIT
  allow_failure: false  # Block merge on failure

# ── Pre-deploy Scan Job ───────────────────────────────────────────────────────
# Runs before any deploy stage. Blocks deploy on CRITICAL findings.
security:pre-deploy:
  extends: .security-base
  stage: pre-deploy  # Define this stage before your deploy stage
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: never
  script:
    - |
      echo "🔐 Pre-deploy security scan"
      echo "    Commit: $CI_COMMIT_SHA"
      echo "    Pipeline: $CI_PIPELINE_ID"
      
      ${SCAN_SCRIPTS_DIR}/scan-all.sh \
        --path . \
        --output "$SECURITY_REPORTS_DIR" \
        --mode predeploy \
        --branch "$CI_COMMIT_BRANCH" \
        --fail-on critical  # Pre-deploy: only block on CRITICAL
      
      SCAN_EXIT=$?
      
      if [[ "$SECURITY_OVERRIDE" == "true" ]]; then
        echo "⚠️  SECURITY_OVERRIDE used by $GITLAB_USER_LOGIN on pipeline $CI_PIPELINE_ID"
        exit 0
      fi
      
      exit $SCAN_EXIT
  allow_failure: false
  needs: []  # Run in parallel with other pre-deploy jobs

# ── Scheduled Full Scan (weekly) ─────────────────────────────────────────────
# Optional: run full history scan weekly on main branch
security:scheduled-full-scan:
  extends: .security-base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SECURITY_SCHEDULED_SCAN == "true"'
      when: always
    - when: never
  script:
    - |
      ${SCAN_SCRIPTS_DIR}/scan-all.sh \
        --path . \
        --output "$SECURITY_REPORTS_DIR" \
        --mode predeploy \
        --branch "$CI_COMMIT_BRANCH" \
        --fail-on high
  allow_failure: true  # Don't block scheduled runs — notify only

# ── Dependency Update Advisory Job ───────────────────────────────────────────
# Separate lightweight job — only dep audit, runs on package.json changes
security:dep-check:
  image: node:20-slim
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/package.json"
        - "**/package-lock.json"
      when: always
    - when: never
  script:
    - |
      mkdir -p "$SECURITY_REPORTS_DIR"
      chmod +x ${SCAN_SCRIPTS_DIR}/dep-audit.sh
      ${SCAN_SCRIPTS_DIR}/dep-audit.sh \
        --path . \
        --output "$SECURITY_REPORTS_DIR" \
        --mode mr
  artifacts:
    when: always
    paths:
      - security-reports/dep-results.json
    expire_in: 7 days
  allow_failure: false
